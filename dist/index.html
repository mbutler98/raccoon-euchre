/* Trash Night Euchre — taped paper over the alley.
   Menu = the crew scene. Game = the empty alley with a cardboard table.
   Type: Kalam (orange marker), Rubik Wet Paint (teal drip graffiti), Permanent Marker (labels, numbers). */
:root{
  color-scheme:dark;
  --ink:#24202b; --night:#141720;
  --paper:#efe7d6; --paper-2:#e4dccb; --label:#dfe3e6; --sticky:#f6df74;
  --text:#f4efe4; --muted:#b9b3a8;
  --orange:#f6a35c; --orange-ink:#4a1f2c; --teal:#a8e6f0; --teal-ink:#0f4a52;
  --us:#2f7fd1; --them:#d4473f; --gold:#f2b440; --violet:#8a5ad6; --green:#4fae6a;
  --hand:'Kalam','Comic Sans MS','Segoe Print',cursive;
  --marker:'Permanent Marker','Kalam','Comic Sans MS',cursive;
  --drip:'Rubik Wet Paint','Permanent Marker',cursive;
  --cw:60px; --hw:74px;
  --noise:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .32  0 0 0 0 .25  0 0 0 0 .15  0 0 0 .2 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  --fibers:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='.02 .6' numOctaves='3' seed='4'/><feColorMatrix values='0 0 0 0 .3  0 0 0 0 .2  0 0 0 0 .08  0 0 0 .28 0'/></filter><rect width='100%25' height='100%25' filter='url(%23f)'/></svg>");
}

html{box-sizing:border-box;height:100%}

body{height:100%;margin:0;background:var(--night);color:var(--text);font-family:var(--hand);font-size:17px;overflow:hidden;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-text-size-adjust:100%}

#app{position:relative;z-index:2;height:100%;max-width:560px;margin:0 auto;padding-inline:14px;
  background:var(--scene) 42% top/cover no-repeat;box-shadow:0 0 60px rgba(0,0,0,.6)}
#app::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background:linear-gradient(180deg,rgba(10,12,22,.55) 0%,rgba(10,12,22,0) 22%,rgba(10,12,22,0) 46%,rgba(10,12,22,.82) 72%,rgba(10,12,22,.95) 100%)}
body[data-scene="table"] #app::before{background:linear-gradient(180deg,rgba(10,12,22,.62),rgba(10,12,22,.35) 40%,rgba(10,12,22,.75) 78%,rgba(10,12,22,.92))}
body[data-scene="sub"] #app::before{background:rgba(10,12,22,.8)}
#flash{position:fixed;inset:0;z-index:70;pointer-events:none;opacity:0;background:var(--fc,#f2b440);mix-blend-mode:soft-light}
#flash.go{animation:flash 1.1s ease-out}
@keyframes flash{0%{opacity:0}15%{opacity:.85}100%{opacity:0}}
.screen{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}

/* ---------- paper bits ---------- */
.tape,.btn::before,.note::before,.team::before,.trumpchip::before,#modal::before,.polaroid::before,.tblcard::before{
  content:"";position:absolute;width:46px;height:16px;background:rgba(232,236,240,.55);box-shadow:0 1px 1px rgba(0,0,0,.15);z-index:3;pointer-events:none}
.btn{--c:var(--ink);--r:0deg;position:relative;border:0;border-radius:3px;cursor:pointer;
  background:var(--noise),var(--label);color:var(--c);font-family:var(--hand);font-weight:700;font-size:21px;line-height:1.1;padding:11px 10px 10px;
  rotate:var(--r);box-shadow:0 2px 0 rgba(0,0,0,.25),0 8px 16px rgba(0,0,0,.35);transition:transform .08s,box-shadow .08s,filter .15s}
.btn::before{left:-10px;top:-6px;rotate:-28deg}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25),0 3px 8px rgba(0,0,0,.35)}
.btn:focus-visible,.hcard:focus-visible,.note:focus-visible,.tog:focus-visible,.tblcard:focus-visible,.deckcard:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
.btn[disabled]{filter:grayscale(.7) brightness(.7);pointer-events:none}
.btn small{display:block;font-size:13px;font-weight:400;color:#5a5560;margin-top:2px;-webkit-text-stroke:0}
.btn.big{font-size:34px;padding:12px 14px 10px}
.btn.small{font-size:16px;padding:6px 12px}
.btn.sq{flex:0 0 54px!important;font-size:24px;font-family:system-ui,sans-serif}
.b-gold{color:var(--orange);-webkit-text-stroke:5px var(--orange-ink);paint-order:stroke fill;letter-spacing:.01em}
.b-teal{color:var(--teal);-webkit-text-stroke:5px var(--teal-ink);paint-order:stroke fill}
.b-violet{color:#c9a8ff;-webkit-text-stroke:5px #2e1a4f;paint-order:stroke fill}
.b-plain{color:var(--ink)}
.b-gold small,.b-teal small,.b-violet small{-webkit-text-stroke:0}
.btn.rec{box-shadow:0 0 0 3px var(--gold),0 2px 0 rgba(0,0,0,.25),0 8px 16px rgba(0,0,0,.35)}
.btn.rec::after,.hcard.rec::after{content:"★";position:absolute;top:-11px;right:-8px;z-index:6;width:24px;height:24px;border-radius:50%;background:var(--gold);
  color:var(--ink);font:16px/24px system-ui,sans-serif;text-align:center;-webkit-text-stroke:0;box-shadow:0 2px 0 rgba(0,0,0,.35);rotate:12deg}
.badge{position:absolute;top:-10px;right:-6px;background:var(--them);color:#fff;font-size:13px;padding:1px 7px;border-radius:9px;-webkit-text-stroke:0;rotate:8deg;font-weight:700}
.arow{display:flex;gap:10px}
.arow .btn{flex:1}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 16px);translate:-50% 0;z-index:95;background:var(--noise),var(--sticky);color:var(--ink);
  padding:8px 16px;font-weight:700;font-size:17px;box-shadow:0 8px 16px rgba(0,0,0,.4);rotate:-2deg;white-space:nowrap;max-width:92vw;
  animation:toastin .5s cubic-bezier(.2,1.6,.4,1),toastout .4s ease-in 2.8s forwards}
@keyframes toastin{from{transform:translateY(-140%)}}
@keyframes toastout{to{transform:translateY(-180%);opacity:0}}

/* ---------- home ---------- */
#home{padding-block:22px 16px;gap:10px}
.logo{text-align:center;margin:0;line-height:.85;filter:drop-shadow(0 5px 0 rgba(0,0,0,.45))}
.logo span{display:block}
.logo .l0{font-family:var(--hand);font-weight:700;font-size:clamp(34px,10vw,46px);color:var(--orange);-webkit-text-stroke:8px var(--orange-ink);paint-order:stroke fill;rotate:-3deg}
.logo .l1{font-family:var(--drip);font-size:clamp(58px,17.5vw,96px);color:var(--teal);-webkit-text-stroke:10px var(--teal-ink);paint-order:stroke fill;rotate:2deg;margin-top:-4px;letter-spacing:.02em}
.homemenu{display:flex;flex-direction:column;gap:16px;padding-bottom:4px}
.note{position:relative;display:grid;grid-template-columns:1fr auto auto;grid-template-rows:auto auto;align-items:center;column-gap:10px;text-align:left;
  border:0;padding:10px 14px;background:var(--noise),var(--paper);color:var(--ink);cursor:pointer;rotate:1.2deg;box-shadow:0 8px 16px rgba(0,0,0,.35)}
.note::before{right:20px;top:-8px;rotate:6deg}
.note small{font-size:14px;color:#6b6457;grid-column:1}
.note b{font-size:22px;grid-column:1;line-height:1.1}
.note .faces{grid-row:1/3;grid-column:2;display:flex}
.note .faces img{width:44px;height:44px;border-radius:50%;background:#2b2a33;border:2px solid var(--ink)}
.note .faces img+img{margin-left:-12px}
.note .chev{grid-row:1/3;grid-column:3;font-style:normal;font-size:30px;color:#6b6457}
.homestats{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 16px;color:var(--muted);font-size:15px;min-height:20px}
.homestats b{color:var(--text);font-family:var(--marker);font-weight:400}

/* ---------- sub screens ---------- */
.subhead{display:flex;align-items:center;gap:12px;padding-block:18px 10px}
.subhead h2{margin:0;flex:1;text-align:center;font-family:var(--drip);font-weight:400;font-size:44px;color:var(--teal);-webkit-text-stroke:7px var(--teal-ink);paint-order:stroke fill;padding-right:70px}
.subbody{flex:1;overflow-y:auto;padding:12px 4px 24px;display:flex;flex-direction:column;gap:18px}
.tblcard{position:relative;display:flex;align-items:center;gap:12px;border:0;padding:12px;text-align:left;cursor:pointer;
  background:var(--noise),var(--paper);color:var(--ink);box-shadow:0 8px 16px rgba(0,0,0,.4);rotate:var(--r,0deg)}
.tblcard::before{left:50%;top:-8px;translate:-50% 0}
.tblcard[aria-checked="true"]{box-shadow:0 0 0 4px var(--orange),0 8px 16px rgba(0,0,0,.4)}
.tblcard .faces{display:flex;flex:none}
.tblcard .faces img{width:58px;height:58px;border-radius:6px;background:#2b2a33;border:3px solid #fff;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.tblcard .faces img:first-child{rotate:-6deg}.tblcard .faces img+img{margin-left:-14px;rotate:5deg}
.tblcard .tx{flex:1;min-width:0}
.tblcard .tx b{display:block;font-size:22px;line-height:1.1}
.tblcard .tx small{display:block;color:#5d5648;font-size:15px;line-height:1.25;margin-top:3px}
.tblcard .lvl{font-family:var(--marker);font-size:17px;flex:none;rotate:-6deg}
.tblcard .wins{display:block;font-size:13px;color:#7a7264;margin-top:4px}
.lvl.easy{color:#2f8a4a} .lvl.med{color:#d27a1f} .lvl.hard{color:#c23a32}
.deckhead{display:flex;gap:12px;justify-content:center}
.deckhead .btn{flex:0 0 auto;min-width:110px}
.deckhead .btn[aria-selected="true"]{box-shadow:0 0 0 3px var(--orange),0 8px 16px rgba(0,0,0,.35)}
.deckgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px 12px}
.deckcard{border:0;background:none;padding:0;color:var(--text);display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;text-align:center;font-family:var(--hand)}
.deckcard .card{--w:min(84px,24vw)}
.deckcard .cardwrap{position:relative}
.deckcard b{font-size:16px;line-height:1.1}
.deckcard small{font-size:13px;color:var(--muted);line-height:1.2;max-width:110px}
.deckcard .inuse{font-family:var(--marker);color:var(--orange);font-size:15px;rotate:-4deg}
.deckcard.locked .card{filter:grayscale(1) brightness(.35)}
.deckcard.locked .cardwrap::after{content:"🔒";position:absolute;inset:0;display:grid;place-items:center;font-size:26px;font-family:system-ui}
.deckcard.sel .card{outline:3px solid var(--orange);outline-offset:4px;border-radius:8px}
.prog{width:80px;height:6px;border-radius:3px;background:rgba(255,255,255,.15);overflow:hidden}
.prog i{display:block;height:100%;background:var(--orange)}
.decknote{color:var(--muted);text-align:center;font-size:15px;margin:0}

/* ---------- game: top bar ---------- */
.topbar{display:flex;align-items:flex-start;gap:10px;padding-block:16px 2px}
.score{display:flex;gap:10px;flex:1;min-width:0}
.team{position:relative;display:grid;grid-template-columns:auto 1fr;align-items:center;column-gap:6px;flex:1;min-width:0;max-width:140px;
  background:var(--noise),var(--paper);color:var(--ink);padding:5px 10px 6px;rotate:var(--r);box-shadow:0 6px 12px rgba(0,0,0,.35)}
.team::before{left:50%;top:-8px;translate:-50% 0;width:38px}
.team.us{--tc:var(--us)} .team.them{--tc:var(--them)}
.team b{font-family:var(--marker);font-weight:400;font-size:18px;color:var(--tc)}
.team .pts{font-family:var(--marker);font-size:28px;line-height:1;text-align:right}
.team .bar{grid-column:1/3;display:flex;gap:3px;margin-top:3px}
.team .bar i{flex:1;height:8px;border-radius:50%;border:1.5px solid rgba(36,32,43,.5)}
.team .bar i.on{background:var(--tc);border-color:var(--tc)}
.team.bump{animation:bump .5s cubic-bezier(.3,1.8,.5,1)}
@keyframes bump{40%{transform:scale(1.14)}}
.trumpchip{position:relative;display:flex;align-items:center;gap:6px;background:var(--noise),var(--sticky);color:var(--ink);padding:5px 10px 5px 7px;rotate:4deg;
  box-shadow:0 6px 12px rgba(0,0,0,.35);flex:none}
.trumpchip::before{left:50%;top:-8px;translate:-50% 0;width:30px}
.trumpchip svg{width:24px;height:24px;display:block}
.trumpchip .tt{display:flex;flex-direction:column;line-height:1}
.trumpchip small{font-size:12px;color:#6b5f2a}
.trumpchip b{font-size:17px}
.trumpchip.red svg{color:#c8323a} .trumpchip.black svg{color:var(--ink)}
.trumpchip.pop{animation:bump .6s cubic-bezier(.3,1.8,.5,1)}

/* ---------- table: a cardboard top in the alley ---------- */
#table{position:relative;flex:1;min-height:360px;--ft:76px;--fb:66px;--fcy:calc(var(--ft) + (100% - var(--ft) - var(--fb))/2)}
#felt{position:absolute;left:44px;right:44px;top:var(--ft);bottom:var(--fb);border-radius:10px 14px 8px 16px;
  background:radial-gradient(ellipse at 30% 70%,rgba(90,55,20,.25),transparent 30%),radial-gradient(circle at 78% 22%,rgba(90,55,20,.18),transparent 18%),var(--fibers),var(--noise),linear-gradient(160deg,#cfa268,#b88a51);
  box-shadow:inset 0 0 0 3px rgba(120,80,40,.5),inset 0 0 40px rgba(70,40,10,.35),0 14px 0 #4d3a26,0 22px 30px rgba(0,0,0,.55)}
#felt .stamp{position:absolute;left:50%;bottom:16%;translate:-50% 0;rotate:-8deg;font-family:var(--marker);font-size:15px;color:rgba(150,40,30,.32);white-space:nowrap;
  border:2px solid rgba(150,40,30,.28);padding:0 8px;border-radius:4px}
#felt .t1{left:-14px;top:18px;rotate:-38deg;width:56px;background:rgba(214,198,160,.75)}
#felt .t2{right:-16px;bottom:22px;rotate:-40deg;width:60px;background:rgba(214,198,160,.75)}
#trick{position:absolute;left:50%;top:var(--fcy);width:0;height:0;z-index:6}
.tslot{position:absolute;width:var(--cw);height:calc(var(--cw)*1.4);translate:-50% -50%}
.tslot[data-s="2"]{left:0;top:calc(var(--cw)*-.8)}
.tslot[data-s="0"]{left:0;top:calc(var(--cw)*.8)}
.tslot[data-s="1"]{left:calc(var(--cw)*-.98);top:0}
.tslot[data-s="3"]{left:calc(var(--cw)*.98);top:0}
.tslot .card{--w:var(--cw);rotate:var(--tr,0deg)}
.tslot .card.win{z-index:3}
.tslot[data-s="0"] .card{z-index:2}
#kitty{position:absolute;left:50%;top:var(--fcy);translate:-50% -50%;display:flex;gap:12px;align-items:center}
#kitty .card{--w:var(--cw)}
#kitty .kdeck{position:relative;width:var(--cw);height:calc(var(--cw)*1.4)}
#kitty .kdeck .card{position:absolute;left:0;top:0}
#kitty .kdeck .card:nth-child(2){left:2px;top:-2px;rotate:3deg}
#kitty .kdeck .card:nth-child(3){left:3px;top:-4px;rotate:-2deg}
#kitty .kup{width:var(--cw);height:calc(var(--cw)*1.4)}
#kitty .kup .card{rotate:5deg}
#kitty .kup .card.hot{box-shadow:0 0 0 3px var(--gold),0 0 22px 4px rgba(242,180,64,.6);border-radius:7%/5%}
#kitty .kup .card.down{filter:brightness(.6) saturate(.5);rotate:12deg}
#kitty .kup .card.down::after{content:"turned down";position:absolute;left:50%;top:50%;translate:-50% -50%;rotate:-14deg;z-index:4;font-family:var(--marker);font-size:13px;
  background:var(--noise),var(--sticky);color:var(--ink);padding:1px 6px;white-space:nowrap;box-shadow:0 2px 4px rgba(0,0,0,.4)}
#status{position:absolute;left:50%;bottom:calc(var(--fb) + 44px);translate:-50% 0;white-space:nowrap;font-size:16px;font-weight:700;color:#3d2a14;
  background:var(--noise),rgba(239,231,214,.92);padding:2px 12px;rotate:-1deg;pointer-events:none;max-width:calc(100% - 130px);overflow:hidden;text-overflow:ellipsis;box-shadow:0 3px 6px rgba(0,0,0,.25)}
#status:empty{display:none}
#banner{position:absolute;left:50%;top:var(--fcy);translate:-50% -50%;z-index:20;text-align:center;pointer-events:none;width:max-content;max-width:100%}
#banner b{display:block;font-family:var(--drip);font-weight:400;font-size:clamp(52px,15vw,72px);line-height:1;color:var(--bc);-webkit-text-stroke:9px var(--bk);paint-order:stroke fill;
  filter:drop-shadow(0 5px 0 rgba(0,0,0,.5));rotate:-4deg;animation:slam .5s cubic-bezier(.2,1.6,.4,1)}
#banner span{display:inline-block;margin-top:8px;font-size:18px;font-weight:700;background:var(--noise),var(--paper);color:var(--ink);padding:4px 14px;rotate:2deg;box-shadow:0 6px 12px rgba(0,0,0,.4)}
#banner.good{--bc:var(--orange);--bk:var(--orange-ink)} #banner.bad{--bc:var(--teal);--bk:var(--teal-ink)}
@keyframes slam{from{transform:scale(2.2);opacity:0}}

/* ---------- seats: taped polaroids ---------- */
.seat{position:absolute;display:flex;flex-direction:column;align-items:center;z-index:5;width:92px;--tc:var(--them)}
.seat.us{--tc:var(--us)}
.seat.s2{left:50%;top:0;translate:-50% 0}
.seat.s1{left:-4px;top:var(--fcy);translate:0 -60%}
.seat.s3{right:-4px;top:var(--fcy);translate:0 -60%}
.seat.s0{left:50%;bottom:0;translate:-50% 0;flex-direction:row;width:auto;gap:10px;align-items:flex-end}
.polaroid{position:relative;width:76px;padding:5px 5px 0;background:var(--noise),#f4efe6;box-shadow:0 6px 12px rgba(0,0,0,.45);rotate:var(--pr,0deg);
  transition:transform .25s cubic-bezier(.3,1.6,.5,1),box-shadow .25s}
.polaroid::before{left:50%;top:-8px;translate:-50% 0;width:36px;background:color-mix(in srgb,var(--tc) 55%,rgba(240,240,240,.5))}
.seat.s1 .polaroid{--pr:-4deg} .seat.s2 .polaroid{--pr:2deg} .seat.s3 .polaroid{--pr:4deg} .seat.s0 .polaroid{--pr:-3deg;width:64px}
.polaroid .ph{position:relative;aspect-ratio:1;background:linear-gradient(#3a3f52,#262a38);overflow:hidden}
.polaroid img{position:absolute;inset:4%;width:92%;height:92%}
.polaroid .nm{display:block;text-align:center;font-weight:700;font-size:16px;color:var(--ink);line-height:1;padding:4px 0 5px;white-space:nowrap}
.seat.s0 .polaroid .nm{font-size:14px}
.polaroid .nm small{display:block;font-size:11px;color:var(--us);font-weight:700;margin-top:1px}
.seat.turn .polaroid{transform:translateY(-5px) scale(1.06);box-shadow:0 0 0 3px var(--orange),0 0 22px 4px rgba(246,163,92,.55),0 12px 18px rgba(0,0,0,.45)}
.seat.out .polaroid{filter:grayscale(1) brightness(.55)}
.polaroid.react{animation:react .45s cubic-bezier(.3,1.8,.5,1)}
@keyframes react{40%{transform:scale(1.12) rotate(-5deg)}}
.dchip{position:absolute;bottom:20px;left:-12px;z-index:4;width:26px;height:26px;border-radius:50%;background:#fff;color:var(--ink);font-family:var(--marker);font-size:15px;line-height:21px;
  text-align:center;border:3px dashed var(--them);box-shadow:0 2px 3px rgba(0,0,0,.4)}
.tag{position:absolute;top:-14px;right:-18px;z-index:4;font-size:13px;font-weight:700;padding:1px 6px 0;white-space:nowrap;rotate:8deg;
  background:var(--noise),var(--sticky);color:var(--ink);box-shadow:0 3px 5px rgba(0,0,0,.35);display:flex;align-items:center;gap:3px}
.tag svg{width:13px;height:13px}
.tag.red svg{color:#c8323a}
.seat.s3 .tag{right:auto;left:-20px;rotate:-8deg}
.tag.alone{background:var(--noise),#d7c2ff}
.tag.sit{background:var(--noise),#c9c4ba}
.think{position:absolute;top:-10px;left:-12px;z-index:4;background:var(--noise),var(--paper);color:var(--ink);border-radius:10px;padding:0 6px;font-size:20px;line-height:18px;font-weight:700;
  box-shadow:0 2px 4px rgba(0,0,0,.4);animation:dots 1s steps(3) infinite}
@keyframes dots{0%{clip-path:inset(0 66% 0 0)}100%{clip-path:inset(0 0 0 0)}}
.tally{display:flex;gap:4px;height:18px;margin-top:6px;position:relative;align-items:center;min-width:10px}
.tally i{display:block;width:3px;height:16px;border-radius:2px;background:#f4efe4;opacity:.92;rotate:calc(var(--k)*3deg - 4deg);box-shadow:0 1px 1px rgba(0,0,0,.5)}
.tally i.x{position:absolute;left:-4px;top:7px;width:32px;height:3px;rotate:-24deg}
.tally i.pop{animation:bump .5s cubic-bezier(.3,1.8,.5,1)}
.seat.s0 .tally{margin:0 0 6px}
.backs{display:flex;justify-content:center;height:26px;margin-top:2px}
.backs .card{--w:18px;margin-left:-11px;rotate:calc((var(--k) - 2) * 7deg);transform-origin:50% 120%}
.backs .card:first-child{margin-left:0}
.bubble{position:absolute;z-index:30;background:var(--noise),var(--paper);color:var(--ink);font-size:16px;font-weight:700;line-height:1.15;padding:6px 11px;border-radius:14px;
  box-shadow:0 4px 8px rgba(0,0,0,.4);width:max-content;max-width:160px;animation:bubin .3s cubic-bezier(.2,1.6,.4,1);pointer-events:none}
.bubble::after{content:"";position:absolute;width:12px;height:12px;background:var(--paper);rotate:45deg;bottom:-5px;left:16px}
.bubble.out{animation:bubout .25s ease-in forwards}
@keyframes bubin{from{transform:scale(.3);opacity:0}}
@keyframes bubout{to{transform:scale(.6);opacity:0}}
.seat.s2 .bubble{left:calc(50% + 46px);top:4px;transform-origin:left center}
.seat.s2 .bubble::after{left:-5px;top:12px;bottom:auto}
.seat.s1 .bubble{left:14px;bottom:calc(100% + 8px);transform-origin:left bottom}
.seat.s3 .bubble{right:14px;bottom:calc(100% + 8px);transform-origin:right bottom}
.seat.s3 .bubble::after{left:auto;right:16px}
.seat.s0 .bubble{left:calc(100% + 8px);bottom:30px;transform-origin:left center;max-width:min(140px,calc(50vw - 70px))}
.seat.s0 .bubble::after{left:-5px;bottom:12px}
.bubble.big{background:var(--noise),var(--sticky);font-size:18px}
.bubble.big::after{background:var(--sticky)}

/* ---------- your hand: a loose fan ---------- */
#hand{display:flex;justify-content:center;align-items:flex-end;height:calc(var(--hw)*1.4 + 26px);padding-top:18px;flex:none}
.hcard{--w:var(--hw);border:0;padding:0;background:none;cursor:default;position:relative;margin-left:var(--ov,-10px);
  transform:translateY(var(--fy,0px)) rotate(var(--fr,0deg));transform-origin:50% 100%;transition:transform .2s cubic-bezier(.3,1.5,.5,1),filter .2s}
.hcard:first-child{margin-left:0}
.hcard .card{--w:var(--hw)}
.hcard.ok{cursor:pointer;transform:translateY(calc(var(--fy,0px) - 14px)) rotate(var(--fr,0deg))}
.hcard.ok:hover{transform:translateY(calc(var(--fy,0px) - 22px)) rotate(var(--fr,0deg))}
.hcard.no{filter:brightness(.5) saturate(.6)}
.hcard.rec::after{top:-14px;right:auto;left:50%;translate:-50% 0}
.hcard.newc .card{animation:cardpop .5s cubic-bezier(.3,1.8,.5,1)}
@keyframes cardpop{0%{scale:1.25}100%{scale:1}}

/* ---------- action tray ---------- */
#actions{min-height:124px;padding:4px 2px max(14px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;flex:none}
.coach{position:relative;font-size:16px;color:var(--ink);background:var(--noise),var(--paper);padding:6px 12px;line-height:1.25;rotate:-.6deg;box-shadow:0 4px 8px rgba(0,0,0,.35)}
.coach b{font-family:var(--marker);font-weight:400;color:#d0661a;margin-right:2px}
.hint{font-size:17px;color:var(--muted);text-align:center;padding-top:8px}
.suitbtn{display:flex;align-items:center;justify-content:center;gap:5px;min-width:0;font-size:19px;padding-inline:6px}
.suitbtn svg{width:20px;height:20px;flex:none}
.suitbtn.red svg{color:#c8323a} .suitbtn.black svg{color:var(--ink)}
.alonetog{flex:0 0 auto!important;padding-inline:14px}
.alonetog[aria-pressed="true"]{background:var(--noise),#d7c2ff}

/* ---------- cards: paper ---------- */
.card{--w:60px;width:var(--w);height:calc(var(--w)*1.4);position:relative;line-height:1;flex:none;display:block;font-family:var(--hand)}
.card .inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transform:rotateY(180deg);transition:transform .45s cubic-bezier(.3,1.4,.5,1)}
.card.up .inner{transform:rotateY(0deg)}
.card .face,.card .back{position:absolute;inset:0;border-radius:7%/5%;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;
  box-shadow:0 1px 0 rgba(0,0,0,.2),0 calc(var(--w)*.06) calc(var(--w)*.14) rgba(0,0,0,.4)}
.card .face{background:radial-gradient(ellipse at 50% 50%,transparent 60%,rgba(120,90,50,.18)),var(--noise),#f1e9d8;border:1px solid rgba(90,70,40,.35);color:var(--ink)}
.card .back{transform:rotateY(180deg)}
.card .face{transition:visibility 0s linear .17s}.card:not(.up) .face{visibility:hidden}
.card .back{transition:visibility 0s linear .17s}.card.up .back{visibility:hidden}
.face .cr{position:absolute;left:7%;top:4%;display:flex;flex-direction:column;align-items:center;width:30%;z-index:2}
.face .cr b{font-weight:700;font-size:calc(var(--w)*.34);line-height:.95;letter-spacing:-.05em;white-space:nowrap}
.face .cr svg{width:70%;margin-top:3%}
.face .cr2{left:auto;top:auto;right:7%;bottom:4%;rotate:180deg}
.face .mid{position:absolute;left:50%;top:52%;translate:-50% -50%;width:46%;z-index:1}
.face .mid svg{display:block;width:100%;height:auto}
.face .court{position:absolute;left:50%;top:52%;translate:-50% -50%;font-weight:700;font-size:calc(var(--w)*.5);line-height:1;z-index:1}
.face .court::after{content:"";position:absolute;left:-18%;right:-18%;top:56%;height:24%;background:currentColor;opacity:.14;border-radius:40%;rotate:-6deg;z-index:-1}
.face.red{color:#c3302f}
.face svg{fill:currentColor}
.card .bw{position:absolute;left:50%;bottom:4%;translate:-50% 0;z-index:3;font-size:calc(var(--w)*.15);font-weight:700;
  background:var(--gold);color:var(--ink);padding:0 4px;rotate:-4deg;white-space:nowrap;line-height:1.25}
.card.trump .face{box-shadow:inset 0 0 0 calc(var(--w)*.035) rgba(242,180,64,.95),0 calc(var(--w)*.06) calc(var(--w)*.14) rgba(0,0,0,.4)}
.card.trump .face::before{content:"";position:absolute;left:0;bottom:0;width:0;height:0;border-bottom:calc(var(--w)*.22) solid var(--gold);border-right:calc(var(--w)*.22) solid transparent;z-index:1}
.card.win .face{box-shadow:0 0 0 3px var(--gold),0 0 24px 5px rgba(242,180,64,.8)}
.card.win{translate:0 -4px;transition:translate .2s}
.card.dim{filter:brightness(.6) saturate(.6)}
.flycard{position:fixed;left:0;top:0;z-index:60;pointer-events:none;margin:0}

/* faces you can unlock */
body[data-face="notebook"] .card .face,.card .face.f-notebook{background:linear-gradient(90deg,transparent 15%,rgba(214,80,80,.45) 15% 16.5%,transparent 16.5%),
  repeating-linear-gradient(180deg,transparent 0 calc(var(--w)*.13),rgba(70,120,200,.28) calc(var(--w)*.13) calc(var(--w)*.13 + 1px)),var(--noise),#fbfaf5}
body[data-face="greasy"] .card .face,.card .face.f-greasy{background:radial-gradient(circle at 72% 30%,rgba(200,140,40,.28) 0 14%,transparent 15%),radial-gradient(circle at 26% 76%,rgba(200,140,40,.2) 0 9%,transparent 10%),
  radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(150,100,40,.28)),var(--noise),#efe2c4}
body[data-face="newsprint"] .card .face,.card .face.f-newsprint{background:repeating-linear-gradient(180deg,transparent 0 3px,rgba(60,60,60,.1) 3px 4px),var(--noise),#e3e0d8}
.card .face.f-paper{background:radial-gradient(ellipse at 50% 50%,transparent 60%,rgba(120,90,50,.18)),var(--noise),#f1e9d8}

/* backs you can unlock: body[data-back] themes the table, .b-<id> forces one for previews */
.back,.back.b-classic{background:
  radial-gradient(circle at 50% 50%,var(--paper) 0 9%,transparent 10%),
  repeating-linear-gradient(45deg,transparent 0 5px,rgba(255,255,255,.14) 5px 7px),repeating-linear-gradient(-45deg,transparent 0 5px,rgba(255,255,255,.14) 5px 7px),
  var(--noise),linear-gradient(#c23a32,#a52e27);box-shadow:inset 0 0 0 calc(var(--w)*.06) var(--paper),inset 0 0 0 calc(var(--w)*.08) #a52e27,0 calc(var(--w)*.06) calc(var(--w)*.14) rgba(0,0,0,.45)}
.back::after{content:none}
[data-back="pizza"] .back,.back.b-pizza{background:var(--fibers),var(--noise),#c99a5e;box-shadow:inset 0 0 0 calc(var(--w)*.05) #a87a40,0 calc(var(--w)*.06) calc(var(--w)*.14) rgba(0,0,0,.45)}
[data-back="pizza"] .back::after,.back.b-pizza::after{content:"PIZZA";position:absolute;left:50%;top:50%;translate:-50% -50%;rotate:-28deg;font-family:var(--marker);font-size:calc(var(--w)*.28);color:#c23a2f;
  border:calc(var(--w)*.025) solid #c23a2f;padding:0 5%;border-radius:4px;opacity:.85;line-height:1.2}
[data-back="alley"] .back,.back.b-alley{background:radial-gradient(circle at 66% 26%,#1b2440 0 9%,transparent 9.5%),radial-gradient(circle at 58% 28%,#cfe8dc 0 11%,transparent 11.5%),
  radial-gradient(circle at 20% 70%,#f7c86a 0 3.5%,transparent 4.5%),radial-gradient(circle at 40% 75%,#f7c86a 0 3.5%,transparent 4.5%),radial-gradient(circle at 60% 74%,#f7c86a 0 3.5%,transparent 4.5%),radial-gradient(circle at 80% 69%,#f7c86a 0 3.5%,transparent 4.5%),
  var(--noise),linear-gradient(#1b2440,#2b2650);box-shadow:inset 0 0 0 calc(var(--w)*.05) #f1e9d8,0 calc(var(--w)*.06) calc(var(--w)*.14) rgba(0,0,0,.45)}
[data-back="recycle"] .back,.back.b-recycle{background:repeating-linear-gradient(90deg,transparent 0 10%,rgba(0,0,0,.12) 10% 12%),var(--noise),linear-gradient(#2f7a4c,#245f3b);box-shadow:inset 0 0 0 calc(var(--w)*.05) #e6efe0,0 calc(var(--w)*.06) calc(var(--w)*.14) rgba(0,0,0,.45)}
[data-back="recycle"] .back::after,.back.b-recycle::after{content:"♻";position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--w)*.56);color:#e6efe0;font-family:'Segoe UI Symbol','DejaVu Sans',sans-serif}
[data-back="mask"] .back,.back.b-mask{background:radial-gradient(ellipse at 33% 47%,#f1e9d8 0 7%,transparent 7.5%),radial-gradient(ellipse at 67% 47%,#f1e9d8 0 7%,transparent 7.5%),
  linear-gradient(180deg,transparent 37%,#1d1a22 37% 57%,transparent 57%),repeating-linear-gradient(180deg,#8f8a98 0 12%,#6b6676 12% 20%),var(--noise);box-shadow:inset 0 0 0 calc(var(--w)*.05) #f1e9d8,0 calc(var(--w)*.06) calc(var(--w)*.14) rgba(0,0,0,.45)}
[data-back="grime"] .back,.back.b-grime{background:radial-gradient(circle at 20% 0,#a8e6f0 0 10%,transparent 10.5%),radial-gradient(circle at 70% 0,#a8e6f0 0 7%,transparent 7.5%),var(--noise),#1f4f56;box-shadow:inset 0 0 0 calc(var(--w)*.05) #a8e6f0,0 calc(var(--w)*.06) calc(var(--w)*.14) rgba(0,0,0,.45)}
[data-back="grime"] .back::after,.back.b-grime::after{content:"G";position:absolute;inset:0;display:grid;place-items:center;font-family:var(--drip);font-size:calc(var(--w)*.7);color:var(--teal);-webkit-text-stroke:2px var(--teal-ink);paint-order:stroke fill}
[data-back="king"] .back,.back.b-king{background:var(--noise),radial-gradient(circle,#5a3586,#2e1a4f);box-shadow:inset 0 0 0 calc(var(--w)*.05) var(--gold),inset 0 0 0 calc(var(--w)*.08) #2e1a4f,0 calc(var(--w)*.06) calc(var(--w)*.14) rgba(0,0,0,.45)}
[data-back="king"] .back::after,.back.b-king::after{content:"♛";position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--w)*.6);color:var(--gold);font-family:'Segoe UI Symbol','DejaVu Sans',serif}
[data-back="ace"] .back,.back.b-ace{background:radial-gradient(circle,transparent 30%,rgba(242,180,64,.25)),var(--noise),#141317;box-shadow:inset 0 0 0 calc(var(--w)*.05) var(--gold),0 calc(var(--w)*.06) calc(var(--w)*.14) rgba(0,0,0,.45)}
[data-back="ace"] .back::after,.back.b-ace::after{content:"A";position:absolute;inset:0;display:grid;place-items:center;font-family:var(--marker);font-size:calc(var(--w)*.6);color:var(--gold)}
.card.sm .back::after{display:none}

/* ---------- modal: a taped sheet ---------- */
#scrim{position:fixed;inset:0;background:rgba(8,8,14,.66);z-index:90;animation:fade .2s}
@keyframes fade{from{opacity:0}}
#modal{position:fixed;left:50%;top:50%;translate:-50% -50%;z-index:91;width:min(92vw,410px);max-height:88vh;overflow-y:auto;padding:22px 18px 18px;
  background:var(--noise),var(--paper);color:var(--ink);rotate:-.8deg;box-shadow:0 18px 40px rgba(0,0,0,.6);
  display:flex;flex-direction:column;gap:12px;animation:modalin .35s cubic-bezier(.2,1.6,.4,1)}
#modal::before{left:50%;top:-4px;translate:-50% 0;width:70px}
@keyframes modalin{from{transform:scale(.6) rotate(6deg);opacity:0}}
#modal h2{margin:0;text-align:center;font-family:var(--drip);font-weight:400;font-size:46px;line-height:1;color:var(--teal);-webkit-text-stroke:7px var(--teal-ink);paint-order:stroke fill}
#modal h2.good{color:var(--orange);-webkit-text-stroke-color:var(--orange-ink)}
#modal p{margin:0;line-height:1.35;font-size:17px}
#modal .btns{display:flex;flex-direction:column;gap:14px;margin-top:6px}
.endfaces{display:flex;justify-content:center;gap:16px;padding-top:6px}
.endfaces .polaroid{width:84px;--tc:var(--us)}
.endfaces .polaroid:first-child{--pr:-5deg}.endfaces .polaroid:last-child{--pr:4deg}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.statgrid div{border:2px dashed rgba(36,32,43,.25);border-radius:6px;padding:6px 10px;display:flex;flex-direction:column}
.statgrid small{color:#6b6457;font-size:14px}
.statgrid b{font-family:var(--marker);font-weight:400;font-size:24px}
.unlocks{display:flex;flex-direction:column;gap:8px;background:var(--noise),var(--sticky);padding:10px;rotate:1deg;box-shadow:0 4px 8px rgba(0,0,0,.25)}
.unlocks h3{margin:0;font-family:var(--marker);font-weight:400;font-size:18px}
.unlocks .u{display:flex;align-items:center;gap:10px;font-weight:700}
.unlocks .card{--w:36px}
.toglist{display:flex;flex-direction:column;gap:4px}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;background:none;border:0;border-bottom:2px dashed rgba(36,32,43,.2);padding:8px 2px;font-size:19px;font-weight:700;cursor:pointer;text-align:left;color:var(--ink)}
.tog .sw{width:30px;height:30px;border:3px solid var(--ink);border-radius:5px;position:relative;flex:none;rotate:-3deg;background:rgba(255,255,255,.5)}
.tog[aria-checked="true"] .sw::after{content:"✓";position:absolute;left:1px;top:-14px;font-family:var(--marker);font-size:34px;color:#c8323a}
.tog small{display:block;font-size:13px;font-weight:400;color:#6b6457}
.rules h3{margin:8px 0 4px;font-family:var(--marker);font-weight:400;color:#c8501a;font-size:20px}
.rules ul{margin:0;padding-left:20px;line-height:1.35;font-size:16px}
.rules li{margin-bottom:3px}
.rankrow{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0 4px}
.rankrow .card{--w:40px}

/* ---------- small / short screens ---------- */
@media (max-width:380px){
  .seat{width:84px}
  .polaroid{width:68px}
  #felt{left:38px;right:38px}
  .btn.big{font-size:28px}
}
@media (max-height:740px){
  #table{--ft:68px}
  .polaroid{width:66px}
  #actions{min-height:110px}
  .logo .l1{font-size:72px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

</style>
</head>
<body>
<div id="backdrop" aria-hidden="true"></div>
<div id="flash" aria-hidden="true"></div>

<div id="app">
  <!-- HOME: the alley crew scene is the menu -->
  <section id="home" class="screen">
    <h1 class="logo" aria-label="Trash Night Euchre"><span class="l0">Trash Night</span><span class="l1">EUCHRE</span></h1>
    <div class="grow"></div>
    <div class="homemenu">
      <button class="note tablenote" id="tableNote"><small>Tonight's table</small><b id="tableName"></b><span class="faces" id="tableFaces"></span><i class="chev">›</i></button>
      <button class="btn b-gold big" id="dealBtn" style="--r:-1.5deg">Deal me in</button>
      <div class="arow">
        <button class="btn b-teal hasbadge" id="deckBtn" style="--r:1deg">My deck<span class="badge" id="deckBadge" hidden>new</span></button>
        <button class="btn b-plain" id="rulesBtn" style="--r:-1deg">How to play</button>
        <button class="btn b-plain sq" id="gearBtn" style="--r:2deg" aria-label="Settings">⚙</button>
      </div>
      <div class="homestats" id="homeStats"></div>
    </div>
  </section>

  <!-- SUB SCREEN: tables / deck -->
  <section id="sub" class="screen" hidden>
    <header class="subhead"><button class="btn b-plain small" id="subBack" style="--r:-2deg">‹ Back</button><h2 id="subTitle"></h2></header>
    <div class="subbody" id="subBody"></div>
  </section>

  <!-- GAME -->
  <section id="game" class="screen" hidden>
    <div class="topbar">
      <div class="score">
        <div class="team us" style="--r:-2deg"><b>Us</b><span class="pts" id="scoreUs">0</span><span class="bar" id="barUs"></span></div>
        <div class="team them" style="--r:1.5deg"><b>Them</b><span class="pts" id="scoreThem">0</span><span class="bar" id="barThem"></span></div>
      </div>
      <div class="trumpchip" id="trumpChip" hidden></div>
      <button class="btn b-plain small" id="menuBtn" style="--r:2deg">Menu</button>
    </div>
    <div id="table">
      <div id="felt"><span class="stamp">THIS SIDE UP ↑</span><i class="tape t1"></i><i class="tape t2"></i></div>
      <div class="seat s2" data-s="2"></div>
      <div class="seat s1" data-s="1"></div>
      <div class="seat s3" data-s="3"></div>
      <div class="seat s0" data-s="0"></div>
      <div id="trick">
        <div class="tslot" data-s="2"></div><div class="tslot" data-s="1"></div>
        <div class="tslot" data-s="3"></div><div class="tslot" data-s="0"></div>
      </div>
      <div id="kitty" hidden><div class="kdeck"></div><div class="kup"></div></div>
      <div id="status" aria-live="polite"></div>
      <div id="banner" hidden></div>
    </div>
    <div id="hand"></div>
    <div id="actions"></div>
  </section>
</div>

<div id="fx"></div>
<div id="scrim" hidden></div>
<div id="modal" role="dialog" aria-modal="true" hidden></div>

/* =====================================================================
   EUCHRE RULES ENGINE + RACCOON BRAINS
   card int = suit*6 + rank   rank 0..5 = 9,10,J,Q,K,A   suit 0..3 = ♠ ♥ ♦ ♣
   Same-colour partner suit is 3-s (♠↔♣, ♥↔♦), which is where the left bower lives.
   Seats run clockwise: 0 You (bottom), 1 left, 2 partner (top), 3 right. Teams = seat%2.
   ===================================================================== */
const RANKS=['9','10','J','Q','K','A'];
const RANK_WORD=['Nine','Ten','Jack','Queen','King','Ace'];
const SUITS=['spades','hearts','diamonds','clubs'];
const SUIT_NAME=['Spades','Hearts','Diamonds','Clubs'];
const SUIT_SYM=['♠','♥','♦','♣'];
const isRed=s=>s===1||s===2;
const cs=c=>Math.floor(c/6), cr=c=>c%6;
const partnerOf=p=>(p+2)%4;
const teamOf=p=>p%2;
const isRight=(c,t)=>cr(c)===2&&cs(c)===t;
const isLeft=(c,t)=>cr(c)===2&&cs(c)===3-t;
const effSuit=(c,t)=>isLeft(c,t)?t:cs(c);
const isTrump=(c,t)=>effSuit(c,t)===t;
function power(c,t,led){
  if(isRight(c,t)) return 200;
  if(isLeft(c,t)) return 190;
  if(cs(c)===t) return 100+cr(c);
  if(cs(c)===led) return 50+cr(c);
  return cr(c);
}
function cardName(c,t){
  if(t!=null&&isRight(c,t)) return 'the right bower';
  if(t!=null&&isLeft(c,t)) return 'the left bower';
  return `${RANK_WORD[cr(c)]} of ${SUIT_NAME[cs(c)]}`;
}
const cardShort=c=>RANKS[cr(c)]+SUIT_SYM[cs(c)];
function newDeck(){const d=[];for(let i=0;i<24;i++) d.push(i);for(let i=d.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[d[i],d[j]]=[d[j],d[i]];}return d;}
function legalPlays(hand,led,t){if(led==null) return hand.slice();const f=hand.filter(c=>effSuit(c,t)===led);return f.length?f:hand.slice();}
function trickWinner(plays,t){
  const led=effSuit(plays[0].card,t);let best=plays[0];
  for(const pl of plays) if(power(pl.card,t,led)>power(best.card,t,led)) best=pl;
  return best;
}
/* sort a hand for display: trump first (bowers on top), then alternating colours */
function sortHand(hand,t){
  const order=t==null?[0,1,3,2]:[t,(t+1)%4,(t+2)%4,(t+3)%4].sort((a,b)=>a===t?-1:b===t?1:0);
  // alternate colours after trump
  let rest=order.filter(s=>s!==t);if(t!=null){const blacks=rest.filter(s=>!isRed(s)),reds=rest.filter(s=>isRed(s));
    rest=isRed(t)?[blacks[0],reds[0],blacks[1]].filter(x=>x!=null):[reds[0],blacks[0],reds[1]].filter(x=>x!=null);}
  const seq=t==null?order:[t,...rest];
  const key=c=>{const s=t==null?cs(c):effSuit(c,t);return seq.indexOf(s)*1000-(t==null?cr(c):power(c,t,s));};
  return hand.slice().sort((a,b)=>key(a)-key(b));
}

/* ---------- scoring ---------- */
/* returns {team, pts, kind} kind: make | march | loner | euchre */
function scoreHand(makerSeat,alone,tricks){
  const mt=teamOf(makerSeat),made=tricks[mt],def=tricks[1-mt];
  if(made>=3){
    if(made===5) return {team:mt,pts:alone?4:2,kind:alone?'loner':'march'};
    return {team:mt,pts:1,kind:'make'};
  }
  return {team:1-mt,pts:2,kind:'euchre',def};
}

/* ---------- bot evaluation ---------- */
const TRUMP_VAL=[1.2,1.3,0,1.5,1.7,2.0];
function cardCallValue(c,t){if(isRight(c,t)) return 3;if(isLeft(c,t)) return 2.5;if(cs(c)===t) return TRUMP_VAL[cr(c)];return 0;}
function handStrength(hand,t){
  let s=0,trumps=0;const held=new Set();
  for(const c of hand){
    if(isTrump(c,t)){trumps++;s+=cardCallValue(c,t);}
    else{held.add(cs(c));if(cr(c)===5) s+=.9;else if(cr(c)===4) s+=.2;}
  }
  const voids=3-held.size;if(trumps>=2) s+=.5*voids;
  if(trumps<=1) s-=.6;
  return {s,trumps,right:hand.some(c=>isRight(c,t)),left:hand.some(c=>isLeft(c,t))};
}
/* which card the dealer throws away after picking up */
function chooseDiscard(hand,t){
  const non=hand.filter(c=>!isTrump(c,t));
  if(non.length){
    const bySuit={};non.forEach(c=>(bySuit[cs(c)]=bySuit[cs(c)]||[]).push(c));
    // short a suit if it's a lone non-ace
    const singles=Object.values(bySuit).filter(a=>a.length===1&&cr(a[0])!==5).map(a=>a[0]).sort((a,b)=>cr(a)-cr(b));
    if(singles.length) return singles[0];
    const nonAce=non.filter(c=>cr(c)!==5).sort((a,b)=>cr(a)-cr(b));
    if(nonAce.length) return nonAce[0];
    return non.sort((a,b)=>cr(a)-cr(b))[0];
  }
  return hand.slice().sort((a,b)=>power(a,t,t)-power(b,t,t))[0];
}
function withPickup(hand,up,t){const h=hand.concat([up]);const d=chooseDiscard(h,t);return h.filter(c=>c!==d);}

/* round one: order the upcard? returns {call,alone} */
function botOrder(seat,hand,up,dealer,P,rules){
  const t=cs(up);let st;
  if(seat===dealer) st=handStrength(withPickup(hand,up,t),t);
  else{
    st=handStrength(hand,t);const uv=cardCallValue(up,t);
    if(partnerOf(seat)===dealer) st.s+=uv*.55; else st.s-=uv*.5;
  }
  const s=st.s+(P.nerve||0)*(Math.random()-.5);
  let call=s>=P.call&&st.trumps>=2;
  if(!call) return {call:false,alone:false,score:s};
  let alone=s>=P.alone&&st.trumps>=3&&(st.right||st.left);
  if(rules.canadian&&partnerOf(seat)===dealer) alone=true;   // Canadian loner: ordering your dealer-partner means going it alone
  if(rules.canadian&&partnerOf(seat)===dealer&&s<P.alone-1.2) return {call:false,alone:false,score:s};
  return {call,alone,score:s};
}
/* round two: name a suit? returns {suit|null, alone} */
function botCall(seat,hand,turned,dealer,P,rules){
  let best=null,bs=-9,bst=null;
  for(let t=0;t<4;t++){if(t===turned) continue;const st=handStrength(hand,t);let s=st.s;
    if(t===3-turned&&(seat===(dealer+1)%4)) s+=.35;   // "next": same colour as the turned-down card
    if(s>bs){bs=s;best=t;bst=st;}}
  const forced=rules.stick&&seat===dealer;
  const s=bs+(P.nerve||0)*(Math.random()-.5);
  if(s>=P.call-.15&&bst.trumps>=2||forced){
    const alone=s>=P.alone&&bst.trumps>=3&&(bst.right||bst.left);
    return {suit:best,alone,score:s};
  }
  return {suit:null,alone:false,score:s};
}

/* ---------- card play ---------- */
function unseenHigher(c,t,led,known){
  // is there any card not yet known that beats c in its own effective suit?
  const es=effSuit(c,t);const pw=power(c,t,es);
  for(let x=0;x<24;x++){if(known.has(x)) continue;if(effSuit(x,t)===es&&power(x,t,es)>pw) return true;}
  return false;
}
function trumpsOut(t,known){let n=0;for(let x=0;x<24;x++) if(!known.has(x)&&isTrump(x,t)) n++;return n;}
function keepValue(c,t){if(isTrump(c,t)) return 20+power(c,t,t)/10;if(cr(c)===5) return 12;return cr(c);}
function dumpCard(cards,t){return cards.slice().sort((a,b)=>keepValue(a,t)-keepValue(b,t))[0];}
/*  H = hand state view {trump,maker,alone,out,trick:[{seat,card}],known:Set} */
function botPlay(seat,hand,H,P){
  const t=H.trump,trick=H.trick,led=trick.length?effSuit(trick[0].card,t):null;
  const leg=legalPlays(hand,led,t);if(leg.length===1) return leg[0];
  if(P.sloppy&&Math.random()<P.sloppy) return leg[Math.floor(Math.random()*leg.length)];
  const known=new Set(H.known);hand.forEach(c=>known.add(c));
  const makers=teamOf(H.maker)===teamOf(seat);
  const byPow=(a,b)=>power(b,t,led==null?effSuit(b,t):led)-power(a,t,led==null?effSuit(a,t):led);
  if(!trick.length){
    const trumps=leg.filter(c=>isTrump(c,t)).sort(byPow);
    const non=leg.filter(c=>!isTrump(c,t));
    const offAces=non.filter(c=>cr(c)===5);
    const out=trumpsOut(t,known);
    if(trumps.length&&out>0){
      const boss=!unseenHigher(trumps[0],t,t,known);
      if(makers&&boss) return trumps[0];
      if(makers&&H.maker===seat&&trumps.length>=2) return trumps[0];
      if(makers&&P.leadTrump&&H.maker===partnerOf(seat)) return trumps[0];
    }
    const bossOff=non.filter(c=>!unseenHigher(c,t,cs(c),known));
    if(offAces.length) return offAces[0];
    if(bossOff.length) return bossOff[0];
    if(non.length){
      // defenders: lead a low card, ideally a short suit so we can trump in later
      return non.slice().sort((a,b)=>cr(a)-cr(b))[0];
    }
    return makers?trumps[0]:trumps[trumps.length-1];
  }
  const win=trickWinner(trick,t);const wpow=power(win.card,t,led);
  const active=H.out==null?4:3;const last=trick.length===active-1;
  const partnerWinning=win.seat===partnerOf(seat);
  const winners=leg.filter(c=>power(c,t,led)>wpow).sort((a,b)=>power(a,t,led)-power(b,t,led));
  if(partnerWinning){
    const safe=last||!unseenHigher(win.card,t,led,known)||(wpow>=100&&P.trustPartner);
    if(safe||!winners.length) return dumpCard(leg,t);
    // partner is winning with a weak card and someone still plays after us: cover it if cheap
    const cover=winners.filter(c=>!isTrump(c,t)||effSuit(win.card,t)===t);
    return cover.length?cover[cover.length-1]:dumpCard(leg,t);
  }
  if(winners.length){
    if(last) return winners[0];
    // play a card that will hold up if we have one, else cheapest winner
    const holders=winners.filter(c=>!unseenHigher(c,t,led,known));
    if(holders.length) return holders[0];
    return winners[0];
  }
  return dumpCard(leg,t);
}

function flyCard(html,fromEl,toEl,{ms=380,w=null,rot=0,toRot=0,fromScale=1}={}){

function startMatch(){
  if(G){G.dead=true;if(G.pending) G.pending.rej('abort');}
  const t=TABLES.find(x=>x.id===S().table)||TABLES[0];
  const ids=['you',t.opps[0],'bandit',t.opps[1]];
  const seats=ids.map((id,i)=>({i,id,name:CREW[id].name,hand:[],tricks:0,
    brain:i===0?null:{...BRAINS[CREW[id].brain],sloppy:i%2?t.sloppy:0}}));
  G={table:t,seats,dealer:Math.floor(Math.random()*4),score:[0,0],handNo:0,dead:false,pending:null,
     trump:null,maker:null,alone:false,out:null,trick:[],known:new Set(),upcard:null,
     stats:{tricks:0,euchres:0,euchred:0,loners:0,coachHit:0,coachN:0}};
  show('game');setScene('table');applyLook();buildSeats();renderScore(true);requestAnimationFrame(layout);layout();
  playMatch().catch(e=>{if(e!=='abort') console.error(e);});
}
async function playMatch(){
  setStatus(`${G.table.name}. First to ${WIN_PTS}.`);
  await sleep(700);
  while(G.score[0]<WIN_PTS&&G.score[1]<WIN_PTS){
    await playHand();
    G.dealer=(G.dealer+1)%4;
  }
  endMatch(G.score[0]>=WIN_PTS);
}

/* =====================================================================
   ONE HAND
   ===================================================================== */
async function playHand(){
  G.handNo++;
  Object.assign(G,{trump:null,maker:null,alone:false,out:null,trick:[],known:new Set(),turned:null});
  G.seats.forEach(s=>{s.hand=[];s.tricks=0;});
  clearTrick();renderTrump();$('#hand').innerHTML='';setActions('');
  G.seats.forEach((_,i)=>renderSeat(i));
  const deck=newDeck();
  for(let i=0;i<4;i++) G.seats[i].hand=deck.slice(i*5,i*5+5);
  G.upcard=deck[20];
  setStatus(G.dealer===0?'Your deal':`${nameOf(G.dealer)} deals`);
  await dealAnim();
  renderHand();
  showKitty(true);
  await sleep(300);
  const up=G.upcard,upSuit=cs(up);

  /* ----- round one: order up the up card ----- */
  setStatus(`Up card: ${cardShort(up)}`);
  for(let k=1;k<=4&&G.maker==null;k++){
    const s=(G.dealer+k)%4;setTurn(s);
    let r;
    if(s===0) r=await humanOrder();
    else{await sleep(rnd(650,1050));r=botOrder(s,G.seats[s].hand,up,G.dealer,G.seats[s].brain,{});}
    if(r.call){G.maker=s;G.alone=!!r.alone;G.trump=upSuit;await announceCall(s,1);}
    else passed(s);
  }
  if(G.maker!=null){
    if(G.alone) G.out=partnerOf(G.maker);
    if(G.out===G.dealer){
      setStatus(`${nameOf(G.dealer)} sits out, up card stays down`);
      flipKitty(false);await sleep(700);
    }else await dealerPickup();
  }else{
    /* ----- round two: name another suit ----- */
    const kc=$('#kitty .kup .card');if(kc){kc.classList.remove('hot');kc.classList.add('down');}G.turned=upSuit;
    setStatus(`${SUIT_SYM[upSuit]} turned down. Name a different suit.`);
    await sleep(500);
    for(let k=1;k<=4&&G.maker==null;k++){
      const s=(G.dealer+k)%4;setTurn(s);
      const forced=S().stick&&s===G.dealer;
      let r;
      if(s===0) r=await humanCall(upSuit,forced);
      else{await sleep(rnd(700,1100));r=botCall(s,G.seats[s].hand,upSuit,G.dealer,G.seats[s].brain,{stick:S().stick});}
      if(r.suit!=null){G.maker=s;G.alone=!!r.alone;G.trump=r.suit;await announceCall(s,2);}
      else passed(s);
    }
    if(G.maker==null){
      setTurn(null);setStatus('Everybody passed. Throw them in.');
      await sleep(1300);showKitty(false);return;
    }
    if(G.alone) G.out=partnerOf(G.maker);
  }
  showKitty(false);setTurn(null);
  G.seats.forEach((_,i)=>renderSeat(i));
  renderHand();
  if(G.out!=null){setStatus(G.out===0?`${nameOf(G.maker)} goes alone. Sit back.`:`${G.maker===0?'You go':nameOf(G.maker)+' goes'} alone!`);await sleep(900);}

  /* ----- five tricks ----- */
  let leader=(G.dealer+1)%4;if(leader===G.out) leader=(leader+1)%4;
  for(let tn=0;tn<5;tn++){
    G.trick=[];
    for(let k=0;k<4;k++){
      const s=(leader+k)%4;if(s===G.out) continue;
      setTurn(s);
      let c;
      if(s===0) c=await humanPlay();
      else{await sleep(rnd(520,900));c=botPlay(s,G.seats[s].hand,{trump:G.trump,maker:G.maker,alone:G.alone,out:G.out,trick:G.trick,known:G.known},G.seats[s].brain);}
      await playCard(s,c);
    }
    setTurn(null);
    const w=trickWinner(G.trick,G.trump);
    await finishTrick(w.seat);
    leader=w.seat;
  }
  await scoreTheHand();
}

/* ---------- scoring ---------- */
async function scoreTheHand(){
  const tricks=[teamTricks(0),teamTricks(1)];
  const r=scoreHand(G.maker,G.alone,tricks);
  G.score[r.team]+=r.pts;
  const ours=r.team===0,weMade=teamOf(G.maker)===0;
  const T={make:'Made it',march:'March!',loner:'Loner sweep!',euchre:'Euchred!'}[r.kind];
  let sub;
  if(r.kind==='euchre') sub=weMade?`${G.maker===0?'You':nameOf(G.maker)} got set. +2 them`:`Stopped ${nameOf(G.maker)} cold. +2 us`;
  else sub=`${ours?'Us':'Them'} +${r.pts} · ${tricks[r.team]} tricks`;
  if(r.kind==='euchre'){if(ours) G.stats.euchres++; else G.stats.euchred++;}
  if(r.kind==='loner'&&ours) G.stats.loners++;
  showBanner(T,sub,ours);
  renderScore();$(`.team.${ours?'us':'them'}`).classList.add('bump');setTimeout(()=>$$('.team').forEach(t=>t.classList.remove('bump')),600);
  if(r.kind==='euchre'){ours?sfx.euchre():sfx.bad();flash(ours?'#f2b440':'#3fb5c8');}
  else if(ours){sfx.point();flash('#f2b440');}
  else{sfx.lostTrick();flash('#d4473f');}
  for(let s=0;s<4;s++){
    const scored=teamOf(s)===r.team;
    mood(s,scored?'laugh':(r.kind==='euchre'?'shock':'scowl'),2400);
  }
  // one voice from each side
  const talker=[1,2,3].filter(s=>teamOf(s)===r.team);
  const loser=[1,2,3].filter(s=>teamOf(s)!==r.team);
  if(talker.length) bubble(talker[0],line(talker[0],r.kind==='euchre'?'euchre':'win'),2000);
  if(r.kind==='euchre'&&loser.length){const l=loser[0];setTimeout(()=>G&&!G.dead&&bubble(l,line(l,l===2&&G.maker===0?'youEuchred':'euchred'),1800),600);}
  await sleep(2500);
  $('#banner').hidden=true;
}

/* =====================================================================
   HUMAN INPUT
   ===================================================================== */
function waitInput(auto){
  return new Promise((res,rej)=>{G.pending={res:v=>{G.pending=null;res(v);},rej};
    if(window.__auto) setTimeout(()=>G.pending&&G.pending.res(auto()),5);});
}
function coachOn(){return S().coach;}
function coachNote(hit){G.stats.coachN++;if(hit) G.stats.coachHit++;}
const coachBrain=()=>({...BRAINS.sharp,nerve:0,sloppy:0});

function describeHand(hand,t){
  const st=handStrength(hand,t);
  const bits=[];
  bits.push(`${st.trumps} trump`);
  if(st.right&&st.left) bits.push('both bowers');else if(st.right) bits.push('the right bower');else if(st.left) bits.push('the left bower');
  const aces=hand.filter(c=>!isTrump(c,t)&&cr(c)===5).length;if(aces) bits.push(`${aces} off ace${aces>1?'s':''}`);
  return bits.join(', ');
}
async function humanOrder(){
  const up=G.upcard,t=cs(up),hand=G.seats[0].hand,dealer=G.dealer==0;
  const rec=botOrder(0,hand,up,G.dealer,coachBrain(),{});
  const evalHand=dealer?withPickup(hand,up,t):hand;
  const who=dealer?'you':nameOf(G.dealer);
  const side=partnerOf(0)===G.dealer?' Bandit is dealing, so the up card helps your team.':teamOf(G.dealer)===1&&!dealer?` ${nameOf(G.dealer)} gets the up card if you order.`:'';
  const recKey=rec.call?(rec.alone?'alone':'order'):'pass';
  const coach=coachOn()?`<div class="coach"><b>Coach:</b> ${recKey==='pass'?'Pass':recKey==='alone'?'Go alone':'Order it up'} — you'd have ${describeHand(evalHand,t)}.${side}</div>`:'';
  setActions(`${coach}<div class="arow">
    <button class="btn b-grey" data-a="pass">Pass</button>
    <button class="btn b-gold" data-a="order">${dealer?'Pick it up':'Order up'}<small>${SUIT_SYM[t]} ${suitWord(t)} trump</small></button>
    <button class="btn b-violet" data-a="alone">Alone<small>4 pts if you sweep</small></button></div>`,recKey);
  setStatus(`Order up the ${cardShort(up)}?`);
  const a=await waitInput(()=>recKey);
  setActions('');
  coachNote((a==='pass')===(recKey==='pass'));
  return {call:a!=='pass',alone:a==='alone'};
}
async function humanCall(turned,forced){
  const hand=G.seats[0].hand;
  const rec=botCall(0,hand,turned,G.dealer,coachBrain(),{stick:forced});
  const recKey=rec.suit!=null?'s'+rec.suit:'pass';
  let alone=false;
  const suits=[0,1,2,3].filter(s=>s!==turned);
  const coach=coachOn()?`<div class="coach"><b>Coach:</b> ${rec.suit!=null?`Call ${suitWord(rec.suit)}${rec.alone?' and go alone':''} — ${describeHand(hand,rec.suit)}.`:`Pass — nothing strong enough. Best is ${suitWord(bestSuit(hand,turned))}.`}${forced?' Stick the dealer: you have to call.':''}</div>`:'';
  setActions(`${coach}<div class="arow">${suits.map(s=>`<button class="btn suitbtn ${isRedSuit(s)?'red':'black'}" data-a="s${s}">${SUIT_SVG[s]}${suitWord(s)}</button>`).join('')}</div>
    <div class="arow"><button class="btn b-grey alonetog" data-a="alonetog" aria-pressed="false">Alone: off</button><button class="btn b-grey" data-a="pass" ${forced?'disabled':''}>${forced?'Stuck — must call':'Pass'}</button></div>`,recKey,true);
  setStatus(forced?'Stick the dealer: name trump.':'Name trump, or pass.');
  let a;
  for(;;){
    a=await waitInput(()=>recKey);
    if(a==='alonetog'){alone=!alone;const b=$('[data-a="alonetog"]');b.setAttribute('aria-pressed',alone);b.textContent=`Alone: ${alone?'on':'off'}`;sfx.tap();continue;}
    break;
  }
  setActions('');
  coachNote(a===recKey);
  if(a==='pass') return {suit:null};
  return {suit:+a.slice(1),alone:window.__auto?!!rec.alone:alone};
}
function bestSuit(hand,turned){let b=null,bs=-99;for(let t=0;t<4;t++){if(t===turned) continue;const s=handStrength(hand,t).s;if(s>bs){bs=s;b=t;}}return b;}
async function humanDiscard(){
  const h=G.seats[0].hand,rec=chooseDiscard(h,G.trump);
  setActions(`${coachOn()?`<div class="coach"><b>Coach:</b> Ditch the ${cardShort(rec)}. ${isTrump(rec,G.trump)?'All trump — drop the lowest.':'Getting rid of a weak off-suit card lets you trump in sooner.'}</div>`:''}<div class="hint">Tap a card to discard it</div>`);
  setStatus('Pick a card to throw away');
  G.rec=rec;renderHand('discard');
  const c=await waitInput(()=>rec);
  G.rec=null;setActions('');coachNote(c===rec);
  return c;
}
async function humanPlay(){
  const h=G.seats[0].hand,led=G.trick.length?effSuit(G.trick[0].card,G.trump):null;
  const legal=legalPlays(h,led,G.trump);
  const rec=botPlay(0,h,{trump:G.trump,maker:G.maker,alone:G.alone,out:G.out,trick:G.trick,known:G.known},coachBrain());
  G.rec=rec;G.legal=legal;
  renderHand('play');
  setStatus(G.trick.length?(legal.length<h.length?`Follow ${SUIT_SYM[led]} if you can`:'Your play'):'Your lead');
  setActions(coachOn()?`<div class="coach"><b>Coach:</b> ${explainPlay(rec,legal,led)}</div>`:`<div class="hint">${G.trick.length?'Tap a card to play':'Your lead — tap a card'}</div>`);
  const c=await waitInput(()=>rec);
  coachNote(c===rec);
  G.rec=null;G.legal=null;setActions('');
  return c;
}
function explainPlay(rec,legal,led){
  const t=G.trump,nm=cardShort(rec);
  if(legal.length===1) return `Only one legal card: ${nm}.`;
  if(led==null){
    if(isTrump(rec,t)) return `Lead ${nm} — pull their trump.`;
    if(cr(rec)===5) return `Cash your ace: lead ${nm}.`;
    return `Lead ${nm} and let partner work.`;
  }
  const w=trickWinner(G.trick,t),wp=power(w.card,t,led);
  if(w.seat===2&&power(rec,t,led)<=wp) return `Bandit's winning — throw off ${nm}.`;
  if(power(rec,t,led)>wp) return isTrump(rec,t)&&led!==t?`Trump in with ${nm}.`:`Take it with ${nm}.`;
  return `Can't win this one — ditch ${nm}.`;
}

function renderSeat(s,pop){
  const p=G.seats[s],e=seatEl(s);
  e.classList.toggle('out',G.out===s);
  const ava=e.querySelector('.ava');
  ava.querySelectorAll('.dchip,.tag').forEach(x=>x.remove());
  if(G.dealer===s) ava.insertAdjacentHTML('beforeend','<span class="dchip" title="Dealer">D</span>');
  if(G.maker===s) ava.insertAdjacentHTML('beforeend',`<span class="tag ${G.alone?'alone':''} ${isRedSuit(G.trump)?'red':''}">${SUIT_SVG[G.trump]}${G.alone?'alone!':'called'}</span>`);
  else if(G.out===s) ava.insertAdjacentHTML('beforeend','<span class="tag sit">sitting out</span>');
  const t=e.querySelector('.tally');
  let h='';for(let k=0;k<Math.min(4,p.tricks);k++) h+=`<i style="--k:${k}" class="${pop&&k===p.tricks-1?'pop':''}"></i>`;
  if(p.tricks>=5) h+='<i class="x pop"></i>';
  t.innerHTML=h;t.setAttribute('aria-label',`${p.tricks} tricks`);
  const bk=e.querySelector('.backs');
  if(bk) bk.innerHTML=G.out===s?'':p.hand.map((_,k)=>backHTML('sm',k+(5-p.hand.length)/2)).join('');
}
function setTurn(s){
  $$('.seat').forEach(e=>{e.classList.remove('turn');e.querySelectorAll('.think').forEach(x=>x.remove());});
  if(s==null) return;
  const e=seatEl(s);e.classList.add('turn');
  if(s!==0&&!G.pending) $('#actions').innerHTML=`<div class="hint">${nameOf(s)} is thinking…</div>`;
  if(s!==0) e.querySelector('.ava').insertAdjacentHTML('beforeend','<span class="think">…</span>');
}
function renderScore(init){
  const ids=[['#scoreUs','#barUs'],['#scoreThem','#barThem']];
  ids.forEach(([n,b],t)=>{$(n).textContent=G.score[t];$(b).innerHTML=Array.from({length:WIN_PTS},(_,i)=>`<i class="${i<G.score[t]?'on':''}"></i>`).join('');});
}
function renderTrump(pop){
  const c=$('#trumpChip');
  if(G.trump==null){c.hidden=true;return;}
  c.hidden=false;c.className='trumpchip '+(isRedSuit(G.trump)?'red':'black')+(pop?' pop':'');
  const tt=[teamTricks(0),teamTricks(1)];
  c.innerHTML=`${SUIT_SVG[G.trump]}<span class="tt"><small>TRUMP</small><b>${suitWord(G.trump)}</b></span>`;
}
function renderHand(mode){
  const h=G.seats[0].hand;
  const sorted=sortHand(h,G.trump);
  const box=$('#hand');
  const W=box.clientWidth||360,n=Math.max(1,sorted.length);
  const hw=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--hw'))||72;
  const ov=Math.max(-hw*.5,Math.min(6,(W-8-n*hw)/(Math.max(1,n-1))));
  box.style.setProperty('--ov',ov+'px');
  const prev=new Set($$('#hand .hcard').map(x=>+x.dataset.c));
  const mid=(sorted.length-1)/2;
  box.innerHTML=sorted.map((c,i)=>{
    let cls='hcard';
    if(mode==='play') cls+=G.legal.includes(c)?' ok':' no';
    if(mode==='discard') cls+=' ok';
    if((mode==='play'||mode==='discard')&&coachOn()&&G.rec===c) cls+=' rec';
    if(prev.size&&!prev.has(c)) cls+=' newc';
    const d=i-mid;
    return `<button class="${cls}" data-c="${c}" style="--fr:${(d*3.2).toFixed(1)}deg;--fy:${(Math.abs(d)*Math.abs(d)*2.2).toFixed(1)}px" aria-label="${cardName(c,G.trump)}" ${mode?'':'tabindex="-1"'}>${cardHTML(c,{trump:G.trump})}</button>`;
  }).join('');
  if(G.out===0) box.style.opacity=.35; else box.style.opacity='';
}
function setActions(html,rec,suitRec){
  const a=$('#actions');a.innerHTML=html;
  a.querySelectorAll('.btn').forEach((b,i)=>b.style.setProperty('--r',(((i*53)%5)-2)*.7+'deg'));
  if(rec&&coachOn()){const b=a.querySelector(`[data-a="${rec}"]`);if(b) b.classList.add('rec');}
}
function setStatus(t){$('#status').textContent=t||'';}
function line(s,kind,suit){const v=VOICE[G.seats[s].id];const arr=v&&v[kind];if(!arr) return null;return pick(arr).replace('{s}',suit!=null?suitWord(suit):'');}
function bubble(s,text,ms=1600,big){
  if(!text) return;const e=seatEl(s);e.querySelectorAll('.bubble').forEach(b=>b.remove());
  const b=el(`<div class="bubble${big?' big':''}">${esc(text)}</div>`);e.appendChild(b);
  setTimeout(()=>{b.classList.add('out');setTimeout(()=>b.remove(),260);},ms*Math.max(pace(),.6));
}
const moodTimers={};
function mood(s,m,ms=1200){
  const img=seatEl(s).querySelector('.ava img');if(!img) return;
  const id=G.seats[s].id;img.src=AV(id,m)||AV(id);
  const a=seatEl(s).querySelector('.ava');a.classList.remove('react');void a.offsetWidth;a.classList.add('react');
  clearTimeout(moodTimers[s]);moodTimers[s]=setTimeout(()=>{if(img.isConnected) img.src=AV(id);},ms);
}
function layout(){
  const w=Math.min(innerWidth,560)-24;
  const hw=Math.max(54,Math.min(80,Math.floor(w/5.2)));
  document.documentElement.style.setProperty('--hw',hw+'px');
  const tb=$('#table');
  if(tb&&tb.clientHeight){
    const fw=tb.clientWidth-2*86, fh=tb.clientHeight-64-58;
    const cw=Math.max(46,Math.min(78,Math.floor(Math.min(fw/2.95,fh/3.3))));
    tb.style.setProperty('--cw',cw+'px');
  }
  if(G&&!$('#game').hidden&&G.seats[0].hand.length){const m=$('#hand .hcard.ok')?(G.legal?'play':'discard'):null;renderHand(m);}
}
addEventListener('resize',layout);

/* =====================================================================
   END OF MATCH, MENU, RULES
   ===================================================================== */
function endMatch(won){
  const before=new Set(unlockedIds());
  const st=S();st.played++;if(won){st.won++;st.streak++;st.bestStreak=Math.max(st.bestStreak,st.streak);st.winsBy[G.table.id]=(st.winsBy[G.table.id]||0)+1;}else st.streak=0;
  st.euchresFor+=G.stats.euchres;st.euchredAgainst+=G.stats.euchred;st.loners+=G.stats.loners;st.handsPlayed+=G.handNo;st.tricksTotal+=G.stats.tricks;persist();
  const fresh=[...BACKS,...FACES].filter(it=>!before.has(it.id)&&isUnlocked(it));
  won?sfx.win():sfx.bad();flash(won?'#f2b440':'#d4473f');
  if(fresh.length) setTimeout(()=>sfx.unlock(),900);
  for(let s=0;s<4;s++) mood(s,teamOf(s)===(won?0:1)?'laugh':'scowl',60000);
  const cs_=G.stats,acc=cs_.coachN?Math.round(100*cs_.coachHit/cs_.coachN):0;
  const prev=it=>BACKS.includes(it)?`<div class="card"><div class="inner"><div class="face"></div><div class="back b-${it.id}"></div></div></div>`:cardHTML(5,{faceCls:'f-'+it.id});
  openModal(`<h2 class="${won?'good':''}">${won?'You win!':'They win.'}</h2>
    <div class="endfaces">${[0,2].map(s=>`<div class="polaroid"><div class="ph"><img src="${AV(G.seats[s].id,won?'laugh':'scowl')}" alt=""></div><span class="nm">${G.seats[s].name}</span></div>`).join('')}</div>
    <p style="text-align:center;font-size:19px"><b style="font-family:var(--marker);font-weight:400;font-size:26px">${G.score[0]}</b> to <b style="font-family:var(--marker);font-weight:400;font-size:26px">${G.score[1]}</b> at ${G.table.name}</p>
    ${fresh.length?`<div class="unlocks"><h3>Unlocked!</h3>${fresh.map(it=>`<div class="u">${prev(it)}<span>${it.name}<br><small style="font-weight:400">${BACKS.includes(it)?'card back':'card face'} · ${it.req}</small></span></div>`).join('')}</div>`:''}
    <div class="statgrid">
      <div><small>Hands</small><b>${G.handNo}</b></div>
      <div><small>Tricks you took</small><b>${cs_.tricks}</b></div>
      <div><small>Euchres for us</small><b>${cs_.euchres}</b></div>
      <div><small>Coach agreed</small><b>${acc}%</b></div>
    </div>
    <div class="btns"><button class="btn b-gold big" id="mRematch" style="--r:-1deg">Rematch</button>
      ${fresh.length?'<button class="btn b-teal" id="mDeck" style="--r:1deg">Try it on</button>':''}
      <button class="btn b-plain" id="mHome" style="--r:.6deg">Back to the alley</button></div>`,false);
  $('#mRematch').onclick=()=>{closeModal();startMatch();};
  $('#mHome').onclick=()=>{closeModal();renderHome();};
  if(fresh.length) $('#mDeck').onclick=()=>{closeModal();G.dead=true;G=null;renderDeck(BACKS.includes(fresh[0])?'backs':'faces');};
}
function openModal(html,dismissable=true){$('#modal').innerHTML=html;$('#modal').hidden=false;$('#scrim').hidden=false;$('#scrim').onclick=dismissable?closeModal:null;}
function closeModal(){$('#modal').hidden=true;$('#scrim').hidden=true;}
$('#menuBtn').onclick=()=>{
  sfx.tap();
  const tog=(k,l)=>`<button class="tog" role="switch" data-k="${k}" aria-checked="${!!S()[k]}"><span>${l}</span><span class="sw"></span></button>`;
  openModal(`<h2>Paused</h2><div class="toglist">${tog('coach','Coach hints')}${tog('fast','Fast pace')}${tog('sound','Sound')}</div>
    <div class="btns"><button class="btn b-gold" id="mResume" style="--r:-1deg">Resume</button><button class="btn b-teal" id="mRules" style="--r:1deg">How to play</button><button class="btn b-plain" id="mQuit" style="--r:-.5deg">Quit to the alley</button></div>`);
  bindToggles();
  $('#mResume').onclick=closeModal;
  $('#mRules').onclick=openRules;
  $('#mQuit').onclick=()=>{closeModal();renderHome();};
};
function openRules(){
  const t=1; // hearts as the example
  const order=[2+6*1,2+6*2,5+6*1,4+6*1,3+6*1,1+6*1,0+6*1];
  openModal(`<h2>How to play</h2><div class="rules">
    <h3>The table</h3><ul><li>You and <b>Bandit</b> (across from you) are a team against the two players on your sides.</li><li>24 cards: 9 through Ace. Five cards each. First team to <b>${WIN_PTS}</b> wins.</li></ul>
    <h3>Trump ranking (if ♥ is trump)</h3>
    <div class="rankrow">${order.map(c=>cardHTML(c,{trump:t})).join('')}</div>
    <ul><li>The <b>right bower</b> is the jack of trump. The <b>left bower</b> is the other jack of the same colour — it counts as trump.</li></ul>
    <h3>Picking trump</h3><ul><li>One card is turned up. Going around, each player can <b>order it up</b> (dealer takes it and discards) or pass.</li>
    <li>If all pass, it's turned down and players can name any <i>other</i> suit. With <b>stick the dealer</b> on, the dealer must name one.</li></ul>
    <h3>Playing</h3><ul><li>Follow the suit that was led if you can. Highest trump wins, otherwise the highest card of the led suit.</li></ul>
    <h3>Scoring</h3><ul><li>Calling team takes 3 or 4 tricks: <b>1 pt</b>. All 5: <b>2 pts</b>.</li><li>Go <b>alone</b> (partner sits out) and take all 5: <b>4 pts</b>.</li><li>Calling team takes fewer than 3: they're <b>euchred</b>, other team gets <b>2 pts</b>.</li></ul>
    <h3>Coach</h3><ul><li>With coach hints on, a <b>★</b> marks what a sharp player would do. Trump cards have a gold corner.</li></ul>
    </div><div class="btns"><button class="btn b-gold" id="mClose" style="--r:-1deg">Got it</button></div>`);
  $('#mClose').onclick=closeModal;
}

renderHome();

</script>
